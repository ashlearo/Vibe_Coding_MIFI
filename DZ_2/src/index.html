<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ночь в музее</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1 id="event-title">Ночь в музее</h1>
        <p>15 ноября, 18:30</p>
        <p>Музей космонавтики, проспект Мира, 111</p>
        <p>Вечерняя программа с выставкой и экскурсиями</p>
    </div>

    <button id="show-program">Показать программу</button>
    
    <div id="program" class="info-block" hidden></div>
    
    <div id="data-error" class="error-message" hidden></div>

    <form id="service-form" class="form-block" hidden>
        <label>
            <input type="checkbox" id="guide"> Экскурсия с гидом
        </label><br>
        <label>
            <input type="checkbox" id="audio"> Аудиогид
        </label><br>
        <label>
            <input type="checkbox" id="catalog"> Каталог выставки
        </label><br>
        <button type="submit">Рассчитать</button>
    </form>

    <div id="choice-error" class="error-message" hidden></div>
    <div id="result" class="info-block" hidden></div>
    <div id="report-json" class="json-block" hidden></div>

    <script src="app.js"></script>
</body>
</html>
